apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: chronoflow
  labels:
    app: user-service
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: dubbo
  selector:
    app: user-service
