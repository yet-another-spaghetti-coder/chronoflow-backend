apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: chronoflow
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP
      name: http
    - port: 50053
      targetPort: 50053
      protocol: TCP
      name: dubbo
  selector:
    app: notification-service
