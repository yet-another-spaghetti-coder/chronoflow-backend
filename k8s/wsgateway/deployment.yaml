apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsgateway
  namespace: chronoflow
  # secretKeyRef Secrets (pub-sub, firebase) are synced from GCP SM by ExternalSecrets in k8s/external-secrets/.
  labels:
    app: wsgateway
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wsgateway
  template:
    metadata:
      labels:
        app: wsgateway
        version: v1
    spec:
      serviceAccountName: wsgateway-sa
      tolerations:
        - key: "node.gke.io/balloon-pod-resize"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: wsgateway
          image: asia-southeast1-docker.pkg.dev/chronoflow-1/wsgateway/wsgateway@sha256:4d7bcd52bddbaa1a0bdf56bf4f537065b772890adf5ca8397b72e2a234046077
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
            - name: SERVER_PORT
              value: "8087"
            - name: NACOS_HOST
              value: "nacos.chronoflow.svc.cluster.local"
            - name: NACOS_PORT
              value: "8848"
            - name: NACOS_USERNAME
              value: "nacos"
            - name: NACOS_PASSWORD
              value: "nacos"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb
                  key: uri
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: WS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wsgateway-secrets
                  key: ws-jwt-secret
            - name: WS_ALLOWED_ORIGINS
              value: "https://chronoflow.site,https://chronoflow-frontend-production.up.railway.app"
            - name: WS_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wsgateway-secrets
                  key: internal-service-token
            - name: PUB_SUB_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: pub-sub
                  key: pub-sub-service-account
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: noti-config
                  key: gcp.project.id
            - name: FIREBASE_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: firebase-from-gcp-sm
                  key: account-json
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "800Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 240
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 240
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
