apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendee-service
  namespace: chronoflow
  # secretKeyRef Secrets (database, pub-sub, redis-auth) are synced from GCP SM by ExternalSecrets in k8s/external-secrets/.
  labels:
    app: attendee-service
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: attendee-service
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
        traffic.sidecar.istio.io/excludeOutboundPorts: "8848,9848"
      labels:
        app: attendee-service
        version: v1
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: attendee-service-sa
      tolerations:
        - key: "node.gke.io/balloon-pod-resize"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: attendee-service
          image: asia-southeast1-docker.pkg.dev/chronoflow-1/attendee-service/attendee-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
            - name: dubbo
              containerPort: 50056
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
            - name: SERVER_PORT
              value: "8084"
            - name: NACOS_HOST
              value: "nacos.chronoflow.svc.cluster.local"
            - name: NACOS_PORT
              value: "8848"
            - name: NACOS_USERNAME
              value: "nacos"
            - name: NACOS_PASSWORD
              value: "nacos"
            - name: DUBBO_IP_TO_REGISTRY
              value: attendee-service.chronoflow.svc.cluster.local
            - name: DUBBO_PORT_TO_REGISTRY
              value: "50056"
            - name: PROD_MASTER_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: database
                  key: prod-master-db-host
            - name: PROD_MASTER_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: database
                  key: prod-master-db-port
            - name: PROD_MASTER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: database
                  key: prod-master-db-user
            - name: PROD_MASTER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database
                  key: prod-master-db-password
            - name: PROD_SLAVE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: database
                  key: prod-slave-db-host
            - name: PROD_SLAVE_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: database
                  key: prod-slave-db-port
            - name: PROD_SLAVE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: database
                  key: prod-slave-db-user
            - name: PROD_SLAVE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database
                  key: prod-slave-db-password
            - name: PROD_REDIS_HOST
              value: "redis"
            - name: PROD_REDIS_PORT
              value: "6379"
            - name: PROD_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            # Spring Boot binds this directly to spring.data.redis.password (high precedence vs Nacos YAML).
            # Use this so Redisson/Lock4j still AUTH when Nacos overrides spring.data.redis without a password.
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: PUB_SUB_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: pub-sub
                  key: pub-sub-service-account
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: noti-config
                  key: gcp.project.id
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "800Mi"
              cpu: "400m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 420
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 420
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
