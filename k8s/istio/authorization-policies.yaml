apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: user-service-allow-required-callers
  namespace: chronoflow
  labels:
    app: user-service
    security-control: zero-trust
spec:
  selector:
    matchLabels:
      app: user-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/chronoflow/sa/gateway-sa
              - cluster.local/ns/chronoflow/sa/event-service-sa
              - cluster.local/ns/chronoflow/sa/task-service-sa
              - cluster.local/ns/chronoflow/sa/attendee-service-sa
              - cluster.local/ns/chronoflow/sa/notification-service-sa
    - to:
        - operation:
            paths:
              - /actuator/health
              - /actuator/health/*
              - /actuator/prometheus
---
