apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: user-service-strict-mtls
  namespace: chronoflow
  labels:
    app: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  mtls:
    mode: STRICT
