spring:
  datasource:
    druid:
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        # F-1: Druid stat servlet enabled in dev for ops visibility; credentials sourced from env.
        # Dev fallback keeps the historical "lushuwen / lushuwen" so the existing developer
        # workflow keeps working until a real DRUID_USER / DRUID_PASSWORD is set in .env.
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username: ${DRUID_USER:lushuwen}
        login-password: ${DRUID_PASSWORD:lushuwen}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic:
      druid:
        initial-size: 5
        min-idle: 10
        max-active: 20
        max-wait: 600000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        max-evictable-idle-time-millis: 900000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
      primary: master
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DEV_MASTER_DB_HOST}:${DEV_MASTER_DB_PORT}/user?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: ${DEV_MASTER_DB_USER}
          password: ${DEV_MASTER_DB_PASSWORD}
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver
          lazy: true # Enable lazy loading to ensure startup speed
          url: jdbc:mysql://${DEV_SLAVE_DB_HOST}:${DEV_SLAVE_DB_PORT}/user?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: ${DEV_SLAVE_DB_USER}
          password: ${DEV_SLAVE_DB_PASSWORD}
  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: ${DEV_REDIS_PORT}
      database: ${DEV_REDIS_DATABASE}
      # password: ${DEV_REDIS_PASSWORD}

# Lock4j config
lock4j:
  acquire-timeout: 3000 # Get distributed lock timeout, the default is 3000 milliseconds
  expire: 30000 # Distributed lock timeout, default is 30 milliseconds

# log config
logging:
  level:
    nus.edu.u: debug
    org.springframework: warn

# F-8: dev profile speaks HTTP at http://localhost:5173 — browsers drop Secure cookies over
# plain HTTP, so the auth round-trip silently breaks. Explicitly override the default (which
# stays true for prod). application-prod.yaml does NOT carry this key.
chronoflow:
  cookie:
    security: false

